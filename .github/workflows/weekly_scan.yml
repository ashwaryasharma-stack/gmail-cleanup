name: Weekly Gmail Cleanup

on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail scan
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "https://gmail-cleanup.onrender.com/scan?token=${DASHBOARD_TOKEN}"
